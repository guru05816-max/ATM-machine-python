<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATM Machine</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1e;
    --screen: #0d1f0d;
    --screen-glow: #00ff41;
    --screen-dim: #00aa2a;
    --screen-muted: #006615;
    --card: #111827;
    --border: #1e3a1e;
    --metal: linear-gradient(145deg, #1a1a2e, #16213e, #0f3460);
    --btn-bg: #1a2a1a;
    --btn-border: #2a4a2a;
    --btn-active: #00ff41;
    --danger: #ff4444;
    --warn: #ffaa00;
    --success: #00ff41;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050a14;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', sans-serif;
    padding: 20px;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(0,255,65,0.03) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(0,100,200,0.05) 0%, transparent 60%);
  }

  .atm-body {
    width: 100%;
    max-width: 420px;
    background: var(--metal);
    border-radius: 24px;
    padding: 28px 24px 32px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 30px 80px rgba(0,0,0,0.8),
      0 0 60px rgba(0,255,65,0.04);
    position: relative;
  }

  /* Bank header */
  .atm-header {
    text-align: center;
    margin-bottom: 20px;
  }
  .bank-name {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .atm-label {
    font-size: 10px;
    color: rgba(255,255,255,0.15);
    letter-spacing: 2px;
  }

  /* Screen */
  .screen {
    background: #061006;
    border-radius: 12px;
    border: 2px solid #1a3a1a;
    padding: 20px 18px;
    min-height: 280px;
    position: relative;
    box-shadow:
      inset 0 0 30px rgba(0,0,0,0.6),
      0 0 20px rgba(0,255,65,0.08);
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    border-radius: 10px;
  }

  .screen-title {
    font-size: 11px;
    color: var(--screen-muted);
    letter-spacing: 2px;
    margin-bottom: 16px;
    text-align: center;
  }

  .screen-main {
    font-size: 13px;
    color: var(--screen-glow);
    line-height: 1.8;
  }

  .screen-big {
    font-size: 28px;
    color: var(--screen-glow);
    text-align: center;
    margin: 16px 0 8px;
    text-shadow: 0 0 20px rgba(0,255,65,0.5);
  }

  .screen-label {
    font-size: 10px;
    color: var(--screen-muted);
    text-align: center;
    letter-spacing: 2px;
    margin-bottom: 20px;
  }

  .screen-welcome {
    text-align: center;
    padding: 20px 0;
  }

  .screen-welcome .greet {
    font-size: 11px;
    color: var(--screen-muted);
    letter-spacing: 2px;
    margin-bottom: 20px;
  }

  .screen-welcome .bank-logo {
    font-size: 32px;
    color: var(--screen-glow);
    text-shadow: 0 0 30px rgba(0,255,65,0.6);
    margin-bottom: 8px;
  }

  .screen-welcome .bank-full {
    font-size: 14px;
    color: var(--screen-dim);
    margin-bottom: 24px;
  }

  .screen-welcome .prompt {
    font-size: 11px;
    color: var(--screen-muted);
    animation: blink 1.2s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(0,255,65,0.06);
    cursor: pointer;
    transition: all 0.15s;
  }
  .menu-item:last-child { border-bottom: none; }
  .menu-item:hover .menu-label { color: var(--screen-glow); }

  .menu-num {
    font-size: 11px;
    color: var(--screen-muted);
    width: 20px;
    flex-shrink: 0;
  }
  .menu-label {
    font-size: 13px;
    color: var(--screen-dim);
    transition: color 0.15s;
  }
  .menu-key {
    margin-left: auto;
    font-size: 10px;
    color: var(--screen-muted);
  }

  /* Input field on screen */
  .screen-input-wrap {
    margin: 16px 0 8px;
    position: relative;
  }
  .screen-input {
    width: 100%;
    background: rgba(0,255,65,0.04);
    border: 1px solid rgba(0,255,65,0.2);
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--screen-glow);
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    outline: none;
    letter-spacing: 2px;
  }
  .screen-input::placeholder { color: var(--screen-muted); }
  .screen-input:focus { border-color: rgba(0,255,65,0.5); }

  .screen-hint {
    font-size: 10px;
    color: var(--screen-muted);
    margin-top: 6px;
    text-align: center;
    letter-spacing: 1px;
  }

  .screen-msg {
    text-align: center;
    padding: 12px;
    border-radius: 6px;
    font-size: 12px;
    margin: 12px 0;
    letter-spacing: 1px;
  }
  .screen-msg.success { background: rgba(0,255,65,0.08); color: var(--screen-glow); border: 1px solid rgba(0,255,65,0.2); }
  .screen-msg.error { background: rgba(255,68,68,0.08); color: #ff6666; border: 1px solid rgba(255,68,68,0.2); }
  .screen-msg.warn { background: rgba(255,170,0,0.08); color: #ffcc44; border: 1px solid rgba(255,170,0,0.2); }

  .divider {
    border: none;
    border-top: 1px solid rgba(0,255,65,0.1);
    margin: 12px 0;
  }

  .balance-display {
    background: rgba(0,255,65,0.05);
    border: 1px solid rgba(0,255,65,0.15);
    border-radius: 8px;
    padding: 14px;
    text-align: center;
    margin: 12px 0;
  }
  .balance-label-s { font-size: 9px; color: var(--screen-muted); letter-spacing: 2px; margin-bottom: 6px; }
  .balance-amount { font-size: 24px; color: var(--screen-glow); text-shadow: 0 0 15px rgba(0,255,65,0.4); }

  .txn-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid rgba(0,255,65,0.05);
    font-size: 11px;
  }
  .txn-row:last-child { border-bottom: none; }
  .txn-type { color: var(--screen-dim); }
  .txn-amt { color: var(--screen-glow); }
  .txn-date { color: var(--screen-muted); font-size: 10px; }

  .quick-amounts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 12px 0;
  }
  .quick-btn {
    background: rgba(0,255,65,0.05);
    border: 1px solid rgba(0,255,65,0.15);
    border-radius: 6px;
    padding: 8px;
    color: var(--screen-dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .quick-btn:hover {
    background: rgba(0,255,65,0.12);
    color: var(--screen-glow);
    border-color: rgba(0,255,65,0.4);
  }

  /* Keypad */
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }

  .key {
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    border-radius: 10px;
    padding: 14px 8px;
    color: rgba(255,255,255,0.7);
    font-family: 'Share Tech Mono', monospace;
    font-size: 16px;
    cursor: pointer;
    text-align: center;
    transition: all 0.1s;
    user-select: none;
    box-shadow: 0 4px 0 rgba(0,0,0,0.4);
  }
  .key:hover { background: #253525; border-color: #3a5a3a; }
  .key:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.4);
    background: #1a3a1a;
    color: var(--screen-glow);
  }
  .key.clear { color: #ff6666; }
  .key.enter { color: var(--screen-glow); font-size: 12px; }
  .key.back { color: #ffcc44; }
  .key.wide {
    grid-column: span 3;
    padding: 12px;
    font-size: 13px;
    letter-spacing: 1px;
  }
  .key.action {
    background: rgba(0,255,65,0.08);
    border-color: rgba(0,255,65,0.25);
    color: var(--screen-glow);
  }
  .key.action:hover { background: rgba(0,255,65,0.15); }
  .key.danger-key {
    background: rgba(255,68,68,0.08);
    border-color: rgba(255,68,68,0.25);
    color: #ff6666;
  }

  /* Function buttons beside screen */
  .func-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  .func-btn {
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    border-radius: 8px;
    padding: 10px;
    color: rgba(255,255,255,0.5);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    text-align: center;
    letter-spacing: 1px;
    transition: all 0.15s;
  }
  .func-btn:hover { color: var(--screen-glow); border-color: rgba(0,255,65,0.3); }

  .card-slot {
    text-align: center;
    margin-top: 16px;
    font-size: 9px;
    color: rgba(255,255,255,0.1);
    letter-spacing: 3px;
  }

  .pin-dots {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 16px 0;
  }
  .pin-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1px solid rgba(0,255,65,0.3);
    background: transparent;
    transition: background 0.15s;
  }
  .pin-dot.filled { background: var(--screen-glow); box-shadow: 0 0 8px rgba(0,255,65,0.6); }

  .attempts-bar {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 8px;
  }
  .attempt-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--screen-glow);
  }
  .attempt-dot.used { background: var(--screen-muted); }
</style>
</head>
<body>

<div class="atm-body">
  <div class="atm-header">
    <div class="bank-name">GuruBank</div>
    <div class="atm-label">Automated Teller Machine</div>
  </div>

  <!-- SCREEN -->
  <div class="screen" id="screen">
    <div class="screen-title">● GURUBANK ATM ●</div>
    <div id="screen-content"></div>
  </div>

  <!-- FUNCTION BUTTONS -->
  <div class="func-row" id="func-row" style="display:none">
    <button class="func-btn" id="func1" onclick="funcBtn(1)">F1</button>
    <button class="func-btn" id="func2" onclick="funcBtn(2)">F2</button>
  </div>

  <!-- KEYPAD -->
  <div class="keypad" id="keypad">
    <button class="key" onclick="keyPress('1')">1</button>
    <button class="key" onclick="keyPress('2')">2</button>
    <button class="key" onclick="keyPress('3')">3</button>
    <button class="key" onclick="keyPress('4')">4</button>
    <button class="key" onclick="keyPress('5')">5</button>
    <button class="key" onclick="keyPress('6')">6</button>
    <button class="key" onclick="keyPress('7')">7</button>
    <button class="key" onclick="keyPress('8')">8</button>
    <button class="key" onclick="keyPress('9')">9</button>
    <button class="key clear" onclick="keyPress('clear')">CLR</button>
    <button class="key" onclick="keyPress('0')">0</button>
    <button class="key back" onclick="keyPress('back')">⌫</button>
    <button class="key wide enter" onclick="keyPress('enter')" id="enter-key">ENTER</button>
  </div>

  <div class="card-slot">── INSERT CARD ──</div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────
const accounts = {
  "1001": { name: "Guru Max",   pin: "1234", balance: 50000, transactions: [
    { type: "Initial Deposit", amount: 50000, date: "2026-01-01" }
  ]},
  "1002": { name: "Test User",  pin: "5678", balance: 25000, transactions: [
    { type: "Initial Deposit", amount: 25000, date: "2026-01-01" }
  ]},
};

let state = "welcome";
let currentAcc = null;
let inputBuffer = "";
let pinAttempts = 0;
let pendingAmount = 0;
let transferTo = null;
let pinStep = 0;
let newPinTemp = "";

const MAX_ATTEMPTS = 3;

function fmt(n) {
  return "₱" + Number(n).toLocaleString("en-PH", { minimumFractionDigits: 2 });
}
function nowDate() {
  return new Date().toLocaleDateString("en-PH", { month: "short", day: "numeric", year: "numeric" });
}
function addTxn(accNo, type, amount) {
  accounts[accNo].transactions.unshift({ type, amount, date: nowDate() });
}

// ── SCREEN RENDER ─────────────────────────────────────────────
function render() {
  const sc = document.getElementById("screen-content");
  const fr = document.getElementById("func-row");
  fr.style.display = "none";

  if (state === "welcome") {
    sc.innerHTML = `
      <div class="screen-welcome">
        <div class="greet">WELCOME TO</div>
        <div class="bank-logo">🏦</div>
        <div class="bank-full">GURUBANK ATM</div>
        <hr class="divider">
        <div style="font-size:11px;color:var(--screen-dim);margin-bottom:16px">
          Demo Accounts:<br>
          <span style="color:var(--screen-muted)">1001 → PIN: 1234<br>1002 → PIN: 5678</span>
        </div>
        <div class="prompt">► ENTER ACCOUNT NUMBER</div>
      </div>`;
    setEnter("NEXT →");
    showKeypad(true);

  } else if (state === "pin") {
    const dots = Array(4).fill(0).map((_,i) =>
      `<div class="pin-dot ${inputBuffer.length > i ? 'filled' : ''}"></div>`
    ).join("");
    const attemptDots = Array(MAX_ATTEMPTS).fill(0).map((_,i) =>
      `<div class="attempt-dot ${i >= (MAX_ATTEMPTS - pinAttempts) ? 'used' : ''}"></div>`
    ).join("");
    sc.innerHTML = `
      <div style="text-align:center;padding:8px 0">
        <div style="font-size:10px;color:var(--screen-muted);letter-spacing:2px;margin-bottom:4px">ACCOUNT: ${currentAcc}</div>
        <div style="font-size:12px;color:var(--screen-dim);margin-bottom:16px">ENTER YOUR PIN</div>
        <div class="pin-dots">${dots}</div>
        <div style="font-size:10px;color:var(--screen-muted);margin-bottom:8px">ATTEMPTS REMAINING</div>
        <div class="attempts-bar">${attemptDots}</div>
      </div>`;
    setEnter("CONFIRM");
    showKeypad(true);

  } else if (state === "menu") {
    const acc = accounts[currentAcc];
    sc.innerHTML = `
      <div style="font-size:10px;color:var(--screen-muted);text-align:center;margin-bottom:12px;letter-spacing:2px">MAIN MENU · ${acc.name.toUpperCase()}</div>
      <div class="balance-display">
        <div class="balance-label-s">AVAILABLE BALANCE</div>
        <div class="balance-amount">${fmt(acc.balance)}</div>
      </div>
      <hr class="divider">
      <div class="menu-item" onclick="goTo('balance')"><span class="menu-num">1</span><span class="menu-label">💰 Balance Enquiry</span></div>
      <div class="menu-item" onclick="goTo('deposit')"><span class="menu-num">2</span><span class="menu-label">📥 Deposit Cash</span></div>
      <div class="menu-item" onclick="goTo('withdraw')"><span class="menu-num">3</span><span class="menu-label">📤 Withdraw Cash</span></div>
      <div class="menu-item" onclick="goTo('transfer')"><span class="menu-num">4</span><span class="menu-label">🔄 Fund Transfer</span></div>
      <div class="menu-item" onclick="goTo('history')"><span class="menu-num">5</span><span class="menu-label">📋 Transaction History</span></div>
      <div class="menu-item" onclick="goTo('changepin')"><span class="menu-num">6</span><span class="menu-label">🔑 Change PIN</span></div>`;
    fr.style.display = "grid";
    document.getElementById("func1").textContent = "LOGOUT";
    document.getElementById("func2").textContent = "CANCEL";
    showKeypad(false);

  } else if (state === "balance") {
    const acc = accounts[currentAcc];
    sc.innerHTML = `
      <div style="font-size:10px;color:var(--screen-muted);text-align:center;margin-bottom:16px;letter-spacing:2px">BALANCE ENQUIRY</div>
      <div style="font-size:11px;color:var(--screen-muted);margin-bottom:4px">Account Holder</div>
      <div style="font-size:13px;color:var(--screen-dim);margin-bottom:12px">${acc.name}</div>
      <div style="font-size:11px;color:var(--screen-muted);margin-bottom:4px">Account Number</div>
      <div style="font-size:13px;color:var(--screen-dim);margin-bottom:16px">${currentAcc}</div>
      <hr class="divider">
      <div class="balance-display">
        <div class="balance-label-s">CURRENT BALANCE</div>
        <div class="balance-amount">${fmt(acc.balance)}</div>
      </div>`;
    fr.style.display = "grid";
    document.getElementById("func1").textContent = "◄ MENU";
    document.getElementById("func2").textContent = "LOGOUT";
    showKeypad(false);

  } else if (state === "deposit") {
    sc.innerHTML = `
      <div style="font-size:10px;color:var(--screen-muted);text-align:center;margin-bottom:12px;letter-spacing:2px">CASH DEPOSIT</div>
      <div style="font-size:11px;color:var(--screen-muted);margin-bottom:4px">Current Balance: ${fmt(accounts[currentAcc].balance)}</div>
      <hr class="divider">
      <div style="font-size:11px;color:var(--screen-dim);margin-bottom:8px">Enter deposit amount:</div>
      <div class="screen-input-wrap">
        <input class="screen-input" id="amount-input" type="number" placeholder="0.00" min="1" />
      </div>
      <div class="screen-hint">MAX: ₱1,000,000 per transaction</div>
      <div id="dep-msg"></div>`;
    fr.style.display = "grid";
    document.getElementById("func1").textContent = "◄ MENU";
    document.getElementById("func2").textContent = "CONFIRM";
    document.getElementById("func2").onclick = () => doDeposit();
    showKeypad(false);
    setTimeout(() => document.getElementById("amount-input")?.focus(), 100);

  } else if (state === "withdraw") {
    sc.innerHTML = `
      <div style="font-size:10px;color:var(--screen-muted);text-align:center;margin-bottom:10px;letter-spacing:2px">WITHDRAW CASH</div>
      <div style="font-size:11px;color:var(--screen-muted);margin-bottom:10px">Balance: ${fmt(accounts[currentAcc].balance)}</div>
      <div style="font-size:11px;color:var(--screen-dim);margin-bottom:8px">Quick Select:</div>
      <div class="quick-amounts">
        <div class="quick-btn" onclick="doWithdraw(500)">₱500</div>
        <div class="quick-btn" onclick="doWithdraw(1000)">₱1,000</div>
        <div class="quick-btn" onclick="doWithdraw(2000)">₱2,000</div>
        <div class="quick-btn" onclick="doWithdraw(5000)">₱5,000</div>
        <div class="quick-btn" onclick="doWithdraw(10000)">₱10,000</div>
        <div class="quick-btn" onclick="doWithdraw(20000)">₱20,000</div>
      </div>
      <div class="screen-input-wrap">
        <input class="screen-input" id="wd-input" type="number" placeholder="Other amount..." min="1" />
      </div>
      <div id="wd-msg"></div>`;
    fr.style.display = "grid";
    document.getElementById("func1").textContent = "◄ MENU";
    document.getElementById("func2").textContent = "WITHDRAW";
    document.getElementById("func2").onclick = () => {
      const v = parseFloat(document.getElementById("wd-input").value);
      if (v) doWithdraw(v);
    };
    showKeypad(false);

  } else if (state === "transfer") {
    sc.innerHTML = `
      <div style="font-size:10px;color:var(--screen-muted);text-align:center;margin-bottom:12px;letter-spacing:2px">FUND TRANSFER</div>
      <div style="font-size:11px;color:var(--screen-muted);margin-bottom:10px">Your Balance: ${fmt(accounts[currentAcc].balance)}</div>
      <div style="font-size:11px;color:var(--screen-dim);margin-bottom:6px">Recipient Account No:</div>
      <div class="screen-input-wrap">
        <input class="screen-input" id="to-acc" type="text" placeholder="e.g. 1002" maxlength="10"/>
      </div>
      <div style="font-size:11px;color:var(--screen-dim);margin-bottom:6px;margin-top:10px">Amount (₱):</div>
      <div class="screen-input-wrap">
        <input class="screen-input" id="tr-amount" type="number" placeholder="0.00" min="1"/>
      </div>
      <div id="tr-msg"></div>`;
    fr.style.display = "grid";
    document.getElementById("func1").textContent = "◄ MENU";
    document.getElementById("func2").textContent = "TRANSFER";
    document.getElementById("func2").onclick = () => doTransfer();
    showKeypad(false);

  } else if (state === "history") {
    const txns = accounts[currentAcc].transactions.slice(0, 8);
    const rows = txns.length ? txns.map(t =>
      `<div class="txn-row">
        <div>
          <div class="txn-type">${t.type}</div>
          <div class="txn-date">${t.date}</div>
        </div>
        <div class="txn-amt">${fmt(t.amount)}</div>
      </div>`
    ).join("") : `<div style="color:var(--screen-muted);text-align:center;padding:20px">No transactions yet</div>`;
    sc.innerHTML = `
      <div style="font-size:10px;color:var(--screen-muted);text-align:center;margin-bottom:12px;letter-spacing:2px">TRANSACTION HISTORY</div>
      <div style="font-size:11px;color:var(--screen-muted);margin-bottom:8px">Last ${Math.min(8, txns.length)} transactions</div>
      ${rows}
      <hr class="divider">
      <div style="font-size:11px;color:var(--screen-muted);text-align:right">Balance: ${fmt(accounts[currentAcc].balance)}</div>`;
    fr.style.display = "grid";
    document.getElementById("func1").textContent = "◄ MENU";
    document.getElementById("func2").textContent = "LOGOUT";
    showKeypad(false);

  } else if (state === "changepin") {
    pinStep = 0; newPinTemp = ""; inputBuffer = "";
    sc.innerHTML = `
      <div style="font-size:10px;color:var(--screen-muted);text-align:center;margin-bottom:16px;letter-spacing:2px">CHANGE PIN</div>
      <div style="font-size:12px;color:var(--screen-dim);text-align:center;margin-bottom:8px">Enter CURRENT PIN</div>
      <div class="pin-dots">
        <div class="pin-dot" id="pd0"></div>
        <div class="pin-dot" id="pd1"></div>
        <div class="pin-dot" id="pd2"></div>
        <div class="pin-dot" id="pd3"></div>
      </div>
      <div id="pin-msg"></div>`;
    setEnter("CONFIRM");
    showKeypad(true);

  } else if (state === "success") {
    sc.innerHTML = `
      <div style="text-align:center;padding:24px 0">
        <div style="font-size:40px;margin-bottom:12px">✅</div>
        <div style="font-size:13px;color:var(--screen-glow);margin-bottom:8px" id="success-text">Transaction Successful!</div>
        <div style="font-size:11px;color:var(--screen-muted)" id="success-sub"></div>
        <hr class="divider" style="margin:16px 0">
        <div class="balance-display">
          <div class="balance-label-s">NEW BALANCE</div>
          <div class="balance-amount">${fmt(accounts[currentAcc].balance)}</div>
        </div>
      </div>`;
    fr.style.display = "grid";
    document.getElementById("func1").textContent = "◄ MENU";
    document.getElementById("func2").textContent = "LOGOUT";
    showKeypad(false);

  } else if (state === "logout") {
    sc.innerHTML = `
      <div style="text-align:center;padding:30px 0">
        <div style="font-size:36px;margin-bottom:16px">👋</div>
        <div style="font-size:13px;color:var(--screen-glow);margin-bottom:8px">Thank you, ${accounts[currentAcc]?.name || ''}!</div>
        <div style="font-size:11px;color:var(--screen-muted);margin-bottom:24px">Please take your card</div>
        <div style="font-size:10px;color:var(--screen-muted);letter-spacing:1px">Have a great day!</div>
      </div>`;
    showKeypad(false);
    setTimeout(() => {
      currentAcc = null; pinAttempts = 0; inputBuffer = "";
      state = "welcome"; render();
    }, 3000);
  }
}

function setEnter(label) {
  document.getElementById("enter-key").textContent = label;
}
function showKeypad(show) {
  document.getElementById("keypad").style.display = show ? "grid" : "none";
}

// ── KEY PRESS ─────────────────────────────────────────────────
function keyPress(k) {
  if (state === "welcome") {
    if (k === "enter") { loginStep(); return; }
    if (k === "clear") { inputBuffer = ""; }
    else if (k === "back") { inputBuffer = inputBuffer.slice(0,-1); }
    else if (inputBuffer.length < 10) inputBuffer += k;
    // Show typed acc number
    const sc = document.getElementById("screen-content");
    const inp = sc.querySelector(".prompt");
    if (inp) inp.textContent = inputBuffer ? `Account: ${inputBuffer}` : "► ENTER ACCOUNT NUMBER";

  } else if (state === "pin" || state === "changepin") {
    if (k === "enter") { pinConfirm(); return; }
    if (k === "clear") { inputBuffer = ""; }
    else if (k === "back") { inputBuffer = inputBuffer.slice(0,-1); }
    else if (inputBuffer.length < 4) inputBuffer += k;
    updatePinDots();
  }
}

function updatePinDots() {
  for (let i = 0; i < 4; i++) {
    const d = document.getElementById("pd" + i);
    if (d) d.className = "pin-dot" + (inputBuffer.length > i ? " filled" : "");
  }
  // For login pin screen
  document.querySelectorAll(".pin-dot").forEach((d, i) => {
    d.className = "pin-dot" + (inputBuffer.length > i ? " filled" : "");
  });
}

function loginStep() {
  if (!inputBuffer) return;
  if (!accounts[inputBuffer]) {
    showMsg("screen-content", "❌ Account not found!", "error");
    inputBuffer = "";
    setTimeout(() => render(), 1500);
    return;
  }
  currentAcc = inputBuffer;
  inputBuffer = "";
  pinAttempts = 0;
  state = "pin";
  render();
}

function pinConfirm() {
  if (state === "pin") {
    if (inputBuffer === accounts[currentAcc].pin) {
      state = "menu"; inputBuffer = "";
      render();
    } else {
      pinAttempts++;
      inputBuffer = "";
      if (pinAttempts >= MAX_ATTEMPTS) {
        state = "blocked";
        document.getElementById("screen-content").innerHTML = `
          <div style="text-align:center;padding:30px 0">
            <div style="font-size:36px;margin-bottom:12px">🔒</div>
            <div style="font-size:13px;color:#ff6666;margin-bottom:8px">Card Blocked!</div>
            <div style="font-size:11px;color:var(--screen-muted)">Too many incorrect PIN attempts.</div>
          </div>`;
        showKeypad(false);
        setTimeout(() => { currentAcc = null; pinAttempts = 0; state = "welcome"; render(); }, 3000);
      } else {
        render();
        setTimeout(() => {
          const msg = document.createElement("div");
          msg.className = "screen-msg error";
          msg.textContent = `❌ Wrong PIN! ${MAX_ATTEMPTS - pinAttempts} attempt(s) left`;
          document.getElementById("screen-content").appendChild(msg);
        }, 50);
      }
    }
  } else if (state === "changepin") {
    handleChangePinStep();
  }
}

function handleChangePinStep() {
  if (pinStep === 0) {
    if (inputBuffer !== accounts[currentAcc].pin) {
      document.getElementById("pin-msg").innerHTML = `<div class="screen-msg error">❌ Wrong current PIN!</div>`;
      inputBuffer = "";
      updatePinDots();
      return;
    }
    pinStep = 1; inputBuffer = "";
    document.querySelector(".screen-content div:nth-child(2), #screen-content div")?.remove();
    document.getElementById("screen-content").innerHTML = `
      <div style="font-size:10px;color:var(--screen-muted);text-align:center;margin-bottom:16px;letter-spacing:2px">CHANGE PIN</div>
      <div style="font-size:12px;color:var(--screen-dim);text-align:center;margin-bottom:8px">Enter NEW PIN</div>
      <div class="pin-dots">
        <div class="pin-dot" id="pd0"></div>
        <div class="pin-dot" id="pd1"></div>
        <div class="pin-dot" id="pd2"></div>
        <div class="pin-dot" id="pd3"></div>
      </div>`;

  } else if (pinStep === 1) {
    if (inputBuffer.length !== 4) {
      return;
    }
    newPinTemp = inputBuffer; inputBuffer = "";
    pinStep = 2;
    document.getElementById("screen-content").innerHTML = `
      <div style="font-size:10px;color:var(--screen-muted);text-align:center;margin-bottom:16px;letter-spacing:2px">CHANGE PIN</div>
      <div style="font-size:12px;color:var(--screen-dim);text-align:center;margin-bottom:8px">Confirm NEW PIN</div>
      <div class="pin-dots">
        <div class="pin-dot" id="pd0"></div>
        <div class="pin-dot" id="pd1"></div>
        <div class="pin-dot" id="pd2"></div>
        <div class="pin-dot" id="pd3"></div>
      </div>
      <div id="pin-msg"></div>`;

  } else if (pinStep === 2) {
    if (inputBuffer !== newPinTemp) {
      document.getElementById("pin-msg").innerHTML = `<div class="screen-msg error">❌ PINs do not match!</div>`;
      inputBuffer = "";
      updatePinDots();
      return;
    }
    accounts[currentAcc].pin = newPinTemp;
    inputBuffer = ""; pinStep = 0; newPinTemp = "";
    document.getElementById("screen-content").innerHTML = `
      <div style="text-align:center;padding:24px 0">
        <div style="font-size:36px;margin-bottom:12px">✅</div>
        <div style="font-size:13px;color:var(--screen-glow)">PIN Changed Successfully!</div>
      </div>`;
    showKeypad(false);
    setTimeout(() => { state = "menu"; render(); }, 2000);
  }
}

// ── TRANSACTIONS ──────────────────────────────────────────────
function doDeposit() {
  const v = parseFloat(document.getElementById("amount-input")?.value);
  const msg = document.getElementById("dep-msg");
  if (!v || v <= 0) { msg.innerHTML = `<div class="screen-msg error">❌ Enter a valid amount</div>`; return; }
  if (v > 1000000) { msg.innerHTML = `<div class="screen-msg error">❌ Max deposit is ₱1,000,000</div>`; return; }
  accounts[currentAcc].balance += v;
  addTxn(currentAcc, "Deposit", v);
  state = "success";
  render();
  document.getElementById("success-text").textContent = `Deposited ${fmt(v)}`;
}

function doWithdraw(amount) {
  const acc = accounts[currentAcc];
  const msg = document.getElementById("wd-msg");
  if (!amount || amount <= 0) { if(msg) msg.innerHTML = `<div class="screen-msg error">❌ Enter a valid amount</div>`; return; }
  if (amount > acc.balance) { if(msg) msg.innerHTML = `<div class="screen-msg error">❌ Insufficient balance!</div>`; return; }
  if (amount > 50000) { if(msg) msg.innerHTML = `<div class="screen-msg error">❌ Max withdrawal is ₱50,000</div>`; return; }
  acc.balance -= amount;
  addTxn(currentAcc, "Withdrawal", amount);
  state = "success";
  render();
  document.getElementById("success-text").textContent = `Withdrawn ${fmt(amount)}`;
  document.getElementById("success-sub").textContent = "Please collect your cash";
}

function doTransfer() {
  const toAcc = document.getElementById("to-acc")?.value?.trim();
  const amount = parseFloat(document.getElementById("tr-amount")?.value);
  const msg = document.getElementById("tr-msg");
  if (!toAcc || !accounts[toAcc]) { msg.innerHTML = `<div class="screen-msg error">❌ Recipient account not found</div>`; return; }
  if (toAcc === currentAcc) { msg.innerHTML = `<div class="screen-msg error">❌ Cannot transfer to own account</div>`; return; }
  if (!amount || amount <= 0) { msg.innerHTML = `<div class="screen-msg error">❌ Enter a valid amount</div>`; return; }
  if (amount > accounts[currentAcc].balance) { msg.innerHTML = `<div class="screen-msg error">❌ Insufficient balance!</div>`; return; }
  accounts[currentAcc].balance -= amount;
  accounts[toAcc].balance += amount;
  addTxn(currentAcc, `Transfer → ${accounts[toAcc].name}`, amount);
  addTxn(toAcc, `Transfer ← ${accounts[currentAcc].name}`, amount);
  state = "success";
  render();
  document.getElementById("success-text").textContent = `Transferred ${fmt(amount)}`;
  document.getElementById("success-sub").textContent = `To: ${accounts[toAcc].name}`;
}

// ── NAV ───────────────────────────────────────────────────────
function goTo(s) {
  state = s;
  inputBuffer = "";
  render();
}

function funcBtn(n) {
  if (state === "menu") {
    if (n === 1) { state = "logout"; render(); }
  } else if (state === "balance" || state === "history" || state === "success") {
    if (n === 1) { state = "menu"; render(); }
    if (n === 2) { state = "logout"; render(); }
  } else if (state === "deposit" || state === "withdraw" || state === "transfer") {
    if (n === 1) { state = "menu"; render(); }
  }
}

function showMsg(containerId, text, type) {
  const msg = document.createElement("div");
  msg.className = `screen-msg ${type}`;
  msg.textContent = text;
  document.getElementById(containerId).appendChild(msg);
}

// ── INIT ──────────────────────────────────────────────────────
render();
</script>
</body>
</html>
